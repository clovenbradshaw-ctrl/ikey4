<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iKey Home</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="https://storage.googleapis.com/art_homelessness/favicon-32x32.png" type="image/png">
  <link rel="apple-touch-icon" href="https://storage.googleapis.com/art_homelessness/favicon-32x32.png">
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(17, 24, 39, 0.85);
      --accent: #4f46e5;
      --muted: #94a3b8;
      --text: #f8fafc;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: radial-gradient(circle at top, #1f2937 0%, #0f172a 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; }

    .skip-link {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: -48px;
      background: #fff;
      color: #000;
      padding: 10px 16px;
      border-radius: 999px;
      transition: top 0.2s ease;
      z-index: 999;
    }

    .skip-link:focus { top: 16px; }

    header {
      padding: 20px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(79, 70, 229, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: grid;
      gap: 24px;
    }

    .actions {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .card-button {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      display: grid;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      min-height: 140px;
    }

    .card-button strong {
      font-size: 1.25rem;
    }

    .card-button span {
      color: var(--muted);
      line-height: 1.5;
    }

    .card-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button.card-button {
      border: none;
    }

    #home-summary {
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      display: grid;
      gap: 16px;
    }

    .panel h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .favorites-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .favorite-item {
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      min-width: 80px;
      text-align: center;
    }

    .favorite-item.add {
      border-style: dashed;
    }

    .favorite-remove {
      background: transparent;
      border: none;
      color: var(--muted);
      text-decoration: underline;
      margin-right: 12px;
      cursor: pointer;
    }

    .favorites-manage {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .resources {
      display: grid;
      gap: 12px;
    }

    .resources a {
      color: var(--accent);
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 24px 20px 40px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: rgba(17, 24, 39, 0.9);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      transition: transform 0.3s ease;
      z-index: 200;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-page="home">
<a href="#main" class="skip-link">Skip to main content</a>
<header>
  <div class="brand">
    <div class="brand-logo">🆘</div>
    <div>
      <h1 style="margin:0; font-size:1.5rem;">iKey</h1>
      <p style="margin:0; color:var(--muted);">Quick actions &amp; offline kit</p>
    </div>
  </div>
  <a href="index.html" style="color:var(--accent); text-decoration:none;">Edit my QR →</a>
</header>
<main id="main">
  <section class="actions" aria-label="Primary actions">
    <button id="home-qr" class="card-button">
      <strong>Show my QR</strong>
      <span id="home-summary">Generate your emergency QR first.</span>
    </button>
    <button id="home-share" class="card-button">
      <strong>Share my location</strong>
      <span>Send GPS + address through your normal apps. Copies text if sharing isn’t supported.</span>
    </button>
  </section>

  <section class="panel" aria-label="Favorites">
    <h2>Favorites</h2>
    <p style="margin:0; color:var(--muted);">Optional quick contacts. Add them when you need them.</p>
    <div id="favorites"></div>
  </section>

  <section class="panel resources" aria-label="Resources">
    <h2>Resources</h2>
    <a href="dispatch.html">Dispatch checklist</a>
    <a href="facekey.html">Face key tips</a>
    <a href="hotlines.html">Emergency hotlines</a>
    <a href="resources/">Local resources</a>
    <a href="about.html">About &amp; privacy</a>
  </section>
</main>
<footer>
  Add iKey to your home screen for instant offline access.
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="scripts/qrcode.min.js" defer></script>
<script src="scripts/lz-string.min.js" defer></script>
<script src="scripts/resources.js" defer></script>
<script src="scripts/translate.js" defer></script>
<script src="scripts/app.js" defer></script>
</body>
</html>
