<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Emergency QR</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://storage.googleapis.com/art_homelessness/favicon-32x32.png" type="image/png">
    <link rel="apple-touch-icon" href="https://storage.googleapis.com/art_homelessness/favicon-32x32.png">
    <style>
        :root {
            --bg: #000000;
            --text: #f8fafc;
            --muted: rgba(241, 245, 249, 0.7);
            --accent: #4f46e5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #000000;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 32px 20px 40px;
        }

        #card-qr {
            width: min(420px, 80vw);
            aspect-ratio: 1;
            background: #0f172a;
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        button,
        .link-button {
            padding: 12px 18px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:focus-visible,
        .link-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        #card-text {
            max-width: 640px;
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 16px;
            padding: 18px;
            font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
            color: var(--muted);
            white-space: pre-wrap;
        }

        .hint {
            color: var(--muted);
            text-align: center;
            font-size: 0.95rem;
            padding: 0 20px 24px;
        }

        #card-missing {
            text-align: center;
            padding: 40px 20px;
        }

        #card-missing a {
            color: var(--accent);
            text-decoration: none;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            background: rgba(15, 23, 42, 0.85);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: transform 0.3s ease;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body data-page="card">
<main>
    <img id="card-qr" alt="Emergency QR" src="" hidden>
    <div id="card-missing" hidden>
        <p>No saved QR yet.</p>
        <p><a href="index.html">Create yours</a> to access it here offline.</p>
    </div>
    <div class="controls">
        <button type="button" id="card-toggle">Show text</button>
        <button type="button" data-install hidden>Add to home screen</button>
        <a class="link-button" href="index.html">Edit info</a>
    </div>
    <pre id="card-text" hidden></pre>
</main>
<p class="hint">Tip: tap the browser menu and choose “Add to Home Screen” to pin this QR for instant access.</p>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="scripts/qrcode.min.js" defer></script>
<script src="scripts/lz-string.min.js" defer></script>
<script src="scripts/resources.js" defer></script>
<script src="scripts/translate.js" defer></script>
<script src="scripts/app.js" defer></script>
</body>
</html>
